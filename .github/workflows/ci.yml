name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the image's default Xcode; print it so the log shows which toolchain built this,
      # and key the build cache on it so objects from another Xcode are never restored.
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode }}-

      - name: Build
        run: swift build

      # RightLayout only works with languages that have a keyboard layout enabled in
      # macOS, and the runner ships with just U.S. English, so enable the layouts the
      # tests type in.
      - name: Enable Russian and Hebrew keyboard layouts
        run: |
          swift scripts/switch_layout.swift enable RussianWin
          swift scripts/switch_layout.swift enable Hebrew
          swift scripts/switch_layout.swift list

      - name: Test
        run: swift test

      # Temporary: check the release packaging (ad hoc signature, no notarization).
      - name: Package app (temporary)
        run: |
          ./releases/build_release.sh 20990101.000000
          APP="releases/build/RightLayout SergeyZh.app"
          ls "$APP/Contents" "$APP/Contents/Resources"
          test -d "$APP/Contents/Resources/RightLayout_RightLayout.bundle"
          codesign -dv --verbose=2 "$APP"
          hdiutil imageinfo releases/RightLayout-SergeyZh-20990101.000000.dmg | head -5
          plutil -p "$APP/Contents/Info.plist" | grep -i version
          # The app must start from the bundle without the build directory.
          rm -rf .build
          "$APP/Contents/MacOS/RightLayout" > app.log 2>&1 &
          PID=$!
          sleep 10
          cat app.log | head -40
          kill -0 $PID && echo "app is running" || { echo "app exited"; exit 1; }
          kill $PID
