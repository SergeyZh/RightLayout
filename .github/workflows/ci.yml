name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A rebase or fast-forward merge puts on main the very files a pull request (or a run
  # on its branch) already built and tested. Find such a run so main doesn't wait for a
  # macOS runner to do it again; a merge that brings anything else changes the tree.
  already-tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.find.outputs.commit }}
    steps:
      - name: Find a passed run of the same tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].head_sha' | sort -u); do
            [ "$sha" != "$GITHUB_SHA" ] || continue
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .tree.sha 2>/dev/null)" = "$tree" ]; then
              echo "Tree $tree already passed in $sha; skipping the build"
              echo "commit=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passed run of tree $tree"

  build-and-test:
    needs: already-tested
    # Also runs when the lookup is skipped (pull requests) or fails.
    if: ${{ !cancelled() && needs.already-tested.outputs.commit == '' }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the image's default Xcode; print it so the log shows which toolchain built this,
      # and key the build cache on it so objects from another Xcode are never restored.
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode }}-

      - name: Build
        run: swift build

      # RightLayout only works with languages that have a keyboard layout enabled in
      # macOS, and the runner ships with just U.S. English, so enable the layouts the
      # tests type in.
      - name: Enable Russian and Hebrew keyboard layouts
        run: |
          swift scripts/switch_layout.swift enable RussianWin
          swift scripts/switch_layout.swift enable Hebrew
          swift scripts/switch_layout.swift list

      - name: Test
        run: swift test

      - name: Test the release notes script
        run: python3 -I scripts/test_release_notes.py
