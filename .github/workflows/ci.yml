name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # RightLayout only works with languages that have a keyboard layout enabled in
      # macOS, and the runner ships with just U.S. English, so enable the layouts the
      # tests type in.
      - name: Enable Russian and Hebrew keyboard layouts
        run: |
          swift scripts/switch_layout.swift enable RussianWin
          swift scripts/switch_layout.swift enable Hebrew
          swift scripts/switch_layout.swift list

      - name: Test
        run: swift test
