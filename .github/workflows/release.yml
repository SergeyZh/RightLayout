name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine version
        id: version
        run: |
          # Build time in UTC, e.g. 20261016.205332 (see scripts/build_version.sh).
          VERSION=$(./scripts/build_version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"
      
      - name: Build release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./rightlayout.sh release build --version "$VERSION"
      
      - name: Create Git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          PKG_PATH="releases/RightLayout-SergeyZh-$VERSION.pkg"
          RELEASES_REPO="SergeyZh/RightLayout"
          NOTES_PATH="releases/notes/$TAG.md"

          if [ -f "$NOTES_PATH" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_PATH")
          else
            NOTES_ARGS=(--notes "RightLayout SergeyZh $TAG — SergeyZh's build of RightLayout (a fork of chernistry/RightLayout, not the official app). Download and run the installer. macOS 13.0+ required.")
          fi
          
          gh release create "$TAG" "$PKG_PATH" \
            --repo "$RELEASES_REPO" \
            --title "RightLayout SergeyZh $TAG" \
            "${NOTES_ARGS[@]}"
          
          echo "✅ Published to https://github.com/$RELEASES_REPO/releases/tag/$TAG"
