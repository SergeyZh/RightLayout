name: Release

# A run is named once, when it starts, but a release's version is the build time and its
# commits run from the previous release's tag to the commit being built, both known only
# once a job runs. So starting a release (workflow_dispatch) only works them out and hands
# them to a second run of this workflow (repository_dispatch), which is named after them,
# e.g. "Release: v20261030.141500 (v20261016.205332..1a2b3c4, 12 commits)", and builds.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && format('Release: v{0} ({1}){2}', github.event.client_payload.version, github.event.client_payload.commits,
  github.event.client_payload.note != '' && format(': {0}', github.event.client_payload.note) || '')
  || format('Release requested from {0} by {1}', github.ref_name, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What this release brings, for the run's name (optional)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [release]

jobs:
  start:
    name: Work out the version and commits
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Sending repository_dispatch needs it.
      contents: write

    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not $GITHUB_REF_NAME"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          # Build time in UTC, e.g. 20261016.205332 (see scripts/build_version.sh).
          VERSION=$(./scripts/build_version.sh)
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          FROM=${PREVIOUS:-$(git rev-list --max-parents=0 --abbrev-commit HEAD | tail -1)}
          COUNT=$(git rev-list --count ${PREVIOUS:+"$PREVIOUS"..}HEAD)
          [ "$COUNT" -eq 1 ] && NOUN=commit || NOUN=commits
          COMMITS="$FROM..${GITHUB_SHA:0:7}, $COUNT $NOUN"
          echo "📦 v$VERSION ($COMMITS)"

          jq -n --arg version "$VERSION" --arg sha "$GITHUB_SHA" --arg commits "$COMMITS" \
            --arg note "$NOTE" --arg requested_by "$GITHUB_ACTOR" \
            '{event_type: "release", client_payload: {version: $version, sha: $sha,
              commits: $commits, note: $note, requested_by: $requested_by}}' \
            | gh api "repos/$GITHUB_REPOSITORY/dispatches" --input -

          {
            echo "### Started v$VERSION ($COMMITS)"
            echo "It is built by the run named \"Release: v$VERSION …\" in [Release runs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, sign and publish
    if: github.event_name == 'repository_dispatch'
    runs-on: macos-26
    # Signing secrets live in the "release" environment, which only main can deploy to,
    # so workflows from other branches and PRs can't read them.
    environment: release
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Worked out by the "start" job of the run that asked for this one. Anyone who can
      # send a repository_dispatch can send any commit, so only commits on main are built.
      - name: Determine version
        id: version
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha }}
          COMMITS: ${{ github.event.client_payload.commits }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{8}\.[0-9]{6}$ ]] || { echo "::error::Bad version: $VERSION"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"
          echo "### Building v$VERSION ($COMMITS), asked for by $REQUESTED_BY" >> "$GITHUB_STEP_SUMMARY"
      
      # From the "Release notes" sections of the pull requests merged since the last
      # release (scripts/release_notes.py). Before tagging, so the last tag is that release's.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "Changes since ${PREVIOUS:-the first commit}"
          git rev-list ${PREVIOUS:+"$PREVIOUS"..}HEAD > "$RUNNER_TEMP/commits.txt"
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 200 \
            --json number,title,body,labels,mergeCommit,url > "$RUNNER_TEMP/prs.json"
          python3 scripts/release_notes.py --prs "$RUNNER_TEMP/prs.json" \
            --commits "$RUNNER_TEMP/commits.txt" --notes-dir releases/notes > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          echo "NOTES_PATH=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain that only lives for this job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          printf '%s' "$MACOS_CERTIFICATE_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./rightlayout.sh release build --version "$VERSION"
      
      - name: Create Git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      
      - name: Create GitHub Release
        env:
          # The job's own token can publish here: the releases go to this same repository.
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          DMG_PATH="releases/RightLayout-SergeyZh-$VERSION.dmg"
          RELEASES_REPO="SergeyZh/RightLayout"

          gh release create "$TAG" "$DMG_PATH" \
            --repo "$RELEASES_REPO" \
            --title "$TAG" \
            --notes-file "$NOTES_PATH"
          
          echo "✅ Published to https://github.com/$RELEASES_REPO/releases/tag/$TAG"
          echo "Published: [$TAG](https://github.com/$RELEASES_REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/certificate.p12"
